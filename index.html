<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexta-Feira TI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050a15;
            --bg-card: #0f1a2d;
            --primary-neon: #00d2ff;
            --success-neon: #00ff88;
            --danger-neon: #ff3366;
            --text-main: #ffffff;
            --text-muted: #88a0bc;
            --border-color: #1e2f4d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; padding-bottom: 80px;
        }

        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header i { font-size: 50px; color: var(--primary-neon); }

        .card-input {
            background: var(--bg-card);
            padding: 20px; border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        label { display: block; margin: 15px 0 5px; color: var(--primary-neon); font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: white; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn-acao {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer;
        }

        .chamado-card {
            background: var(--bg-card); margin-top: 15px; padding: 15px;
            border-radius: 15px; border-left: 5px solid var(--primary-neon);
        }

        .agenda-time { color: var(--success-neon); font-weight: bold; font-size: 0.85em; }
        .finalizado-full-time { color: var(--danger-neon); font-weight: bold; font-size: 0.85em; margin-top: 8px; display: block; }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0a1120; display: flex; justify-content: space-around;
            padding: 15px; border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.7em; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-neon); }
        
        .secao { display: none; }
        .secao.ativa { display: block; }

        .search-container { position: relative; margin-bottom: 15px; }
        .search-container i { position: absolute; left: 12px; top: 12px; color: var(--primary-neon); }
        .search-container input { padding-left: 35px; }

        .btn-card { border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fas fa-robot"></i>
            <h1 style="margin: 10px 0 5px;">SEXTA-FEIRA</h1>
            <p style="color: var(--text-muted); font-size: 0.8em;">GESTÃO TI SAÚDE</p>
        </div>

        <div id="agenda" class="secao ativa">
            <div class="card-input">
                <label><i class="fas fa-hospital"></i> UNIDADE / PSF:</label>
                <input type="text" id="unidade" placeholder="Ex: PSF 09">
                
                <label><i class="fas fa-layer-group"></i> SETOR:</label>
                <select id="setor">
                    <option>Administrativo</option>
                    <option>Consultório</option>
                    <option>Enfermagem</option>
                    <option>Farmácia</option>
                    <option>Recepção</option>
                </select>

                <label><i class="fas fa-tools"></i> DESCRIÇÃO:</label>
                <textarea id="descricao" rows="3"></textarea>
                <button class="btn-acao" onclick="criarChamado()">AGENDAR</button>
            </div>
            <div id="listaChamados"></div>
        </div>

        <div id="relatorio" class="secao">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="buscaRelatorio" placeholder="Pesquisar histórico..." onkeyup="filtrarRelatorio()">
            </div>
            <div id="listaRelatorio"></div>
        </div>

        <div id="pedidos" class="secao">
            <div class="card-input">
                <label><i class="fas fa-map-marker-alt"></i> LOCAL DA ENTREGA:</label>
                <input type="text" id="localPedido" placeholder="Ex: Almoxarifado Central">
                <label><i class="fas fa-box-open"></i> ITEM SOLICITADO:</label>
                <textarea id="itemPedido" rows="3"></textarea>
                <button class="btn-acao" onclick="fazerPedido()">ENVIAR PEDIDO</button>
            </div>
            <div id="listaPedidos"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="mudarAba('agenda', this)"><i class="fas fa-list"></i><br>AGENDA</div>
        <div class="nav-item" onclick="mudarAba('relatorio', this)"><i class="fas fa-file-medical"></i><br>RELATÓRIO</div>
        <div class="nav-item" onclick="mudarAba('pedidos', this)"><i class="fas fa-box"></i><br>PEDIDOS</div>
    </nav>

    <script>
        function mudarAba(abaId, elemento) {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(abaId).classList.add('ativa');
            elemento.classList.add('active');
        }

        function criarChamado() {
            const unidade = document.getElementById('unidade').value;
            const setor = document.getElementById('setor').value;
            const desc = document.getElementById('descricao').value;
            if(!unidade || !desc) return alert("Preencha os campos!");

            const agora = new Date();
            const dataHora = agora.toLocaleDateString('pt-BR') + " | " + agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');

            const card = document.createElement('div');
            card.className = 'chamado-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between">
                    <span style="font-weight:bold; color:var(--primary-neon)">${unidade}</span>
                    <span class="agenda-time">${dataHora}</span>
                </div>
                <div style="font-size:0.8em; color:var(--text-muted)">Setor: ${setor}</div>
                <div style="margin-top:5px" class="desc-text">${desc}</div>
                <div class="status-area"></div>
                <div class="acoes" style="margin-top:15px; display:flex; gap:10px">
                    <button class="btn-card" onclick="finalizar(this)" style="background:var(--success-neon)">Finalizar</button>
                    <button class="btn-card" onclick="this.parentElement.parentElement.remove()" style="background:var(--danger-neon); color:white">Excluir</button>
                </div>
            `;
            document.getElementById('listaChamados').prepend(card);
            document.getElementById('unidade').value = ''; document.getElementById('descricao').value = '';
        }

        function finalizar(btn) {
            const card = btn.parentElement.parentElement;
            const agora = new Date();
            const dataFim = agora.toLocaleDateString('pt-BR');
            const horaFim = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
            
            card.querySelector('.status-area').innerHTML = `
                <span class="finalizado-full-time">
                    <i class="fas fa-check-circle"></i> Finalizado em: ${dataFim} às ${horaFim}
                </span>`;
            
            // Troca os botões para as opções de Relatório
            card.querySelector('.acoes').innerHTML = `
                <button class="btn-card" onclick="voltarParaAgenda(this)" style="background:var(--primary-neon)">Voltar p/ Agenda</button>
                <button class="btn-card" onclick="this.parentElement.parentElement.remove()" style="background:var(--danger-neon); color:white">Excluir</button>
            `;
            
            document.getElementById('listaRelatorio').prepend(card);
        }

        function voltarParaAgenda(btn) {
            const card = btn.parentElement.parentElement;
            card.querySelector('.status-area').innerHTML = ''; // Remove o texto vermelho
            
            // Restaura os botões originais
            card.querySelector('.acoes').innerHTML = `
                <button class="btn-card" onclick="finalizar(this)" style="background:var(--success-neon)">Finalizar</button>
                <button class="btn-card" onclick="this.parentElement.parentElement.remove()" style="background:var(--danger-neon); color:white">Excluir</button>
            `;
            
            document.getElementById('listaChamados').prepend(card);
            alert("Chamado restaurado para a Agenda!");
        }

        function filtrarRelatorio() {
            const busca = document.getElementById('buscaRelatorio').value.toLowerCase();
            const cards = document.getElementById('listaRelatorio').getElementsByClassName('chamado-card');
            for (let card of cards) {
                card.style.display = card.innerText.toLowerCase().includes(busca) ? "block" : "none";
            }
        }

        function fazerPedido() {
            const local = document.getElementById('localPedido').value;
            const item = document.getElementById('itemPedido').value;
            if(!local || !item) return alert("Preencha o pedido!");

            const card = document.createElement('div');
            card.className = 'chamado-card';
            card.style.borderLeftColor = 'var(--success-neon)';
            card.innerHTML = `
                <div style="font-weight:bold; color:var(--success-neon)">PEDIDO: ${local}</div>
                <div style="margin-top:5px">${item}</div>
                <button onclick="this.parentElement.remove()" style="margin-top:10px; width:100%; background:none; border:1px solid var(--danger-neon); color:var(--danger-neon); padding:5px; border-radius:5px">Remover Pedido</button>
            `;
            document.getElementById('listaPedidos').prepend(card);
            document.getElementById('localPedido').value = ''; document.getElementById('itemPedido').value = '';
        }
    </script>
</body>
</html>
