<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexta-Feira TI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050a15;
            --bg-card: #0f1a2d;
            --primary-neon: #00d2ff;
            --success-neon: #00ff88;
            --danger-neon: #ff3366;
            --text-main: #ffffff;
            --text-muted: #88a0bc;
            --border-color: #1e2f4d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; padding-bottom: 80px;
        }

        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header i { font-size: 50px; color: var(--primary-neon); }

        .card-input {
            background: var(--bg-card);
            padding: 20px; border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        label { display: block; margin: 15px 0 5px; color: var(--primary-neon); font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: white; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn-agendar {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer;
        }

        .chamado-card {
            background: var(--bg-card); margin-top: 20px; padding: 15px;
            border-radius: 15px; border-left: 5px solid var(--primary-neon);
        }

        .info-row { display: flex; justify-content: space-between; align-items: center; }
        .agenda-time { color: var(--success-neon); font-weight: bold; font-size: 0.85em; }
        .finalizado-time { color: var(--danger-neon); font-weight: bold; font-size: 0.85em; margin-top: 5px; display: block; }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0a1120; display: flex; justify-content: space-around;
            padding: 15px; border-top: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.7em; text-decoration: none; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-neon); }
        
        .secao { display: none; }
        .secao.ativa { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fas fa-robot"></i>
            <h1 style="margin: 10px 0 5px;">SEXTA-FEIRA</h1>
            <p style="color: var(--text-muted); font-size: 0.8em;">GESTÃO TI SAÚDE</p>
        </div>

        <div id="agenda" class="secao ativa">
            <div class="card-input">
                <label><i class="fas fa-hospital"></i> UNIDADE / PSF:</label>
                <input type="text" id="unidade" placeholder="Ex: PSF 09">

                <label><i class="fas fa-layer-group"></i> SETOR:</label>
                <select id="setor">
                    <option value="Administrativo">Administrativo</option>
                    <option value="Consultório Médico">Consultório Médico</option>
                    <option value="Enfermagem">Enfermagem</option>
                    <option value="Farmácia">Farmácia</option>
                    <option value="Odontologia">Odontologia</option>
                    <option value="Recepção">Recepção</option>
                    <option value="Vacinação">Vacinação</option>
                </select>

                <label><i class="fas fa-tools"></i> DESCRIÇÃO:</label>
                <textarea id="descricao" rows="3"></textarea>

                <button class="btn-agendar" onclick="criarChamado()">AGENDAR</button>
            </div>
            <div id="listaChamados"></div>
        </div>

        <div id="relatorio" class="secao">
            <h2 style="text-align:center; color: var(--primary-neon);">HISTÓRICO FINALIZADO</h2>
            <div id="listaRelatorio"></div>
        </div>

        <div id="pedidos" class="secao">
            <h2 style="text-align:center; color: var(--primary-neon);">PEDIDOS DE MATERIAIS</h2>
            <p style="text-align:center; color: var(--text-muted);">Área para solicitação de toners, peças e periféricos.</p>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="mudarAba('agenda', this)"><i class="fas fa-list"></i><br>AGENDA</div>
        <div class="nav-item" onclick="mudarAba('relatorio', this)"><i class="fas fa-file-medical"></i><br>RELATÓRIO</div>
        <div class="nav-item" onclick="mudarAba('pedidos', this)"><i class="fas fa-box"></i><br>PEDIDOS</div>
    </nav>

    <script>
        function mudarAba(abaId, elemento) {
            // Esconde todas as seções
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            // Remove 'active' de todos os itens da nav
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Ativa a seção e o botão clicado
            document.getElementById(abaId).classList.add('ativa');
            elemento.classList.add('active');
        }

        function criarChamado() {
            const unidade = document.getElementById('unidade').value;
            const setor = document.getElementById('setor').value;
            const descricao = document.getElementById('descricao').value;
            
            if(!unidade || !descricao) {
                alert("Preencha os campos obrigatórios!");
                return;
            }

            const agora = new Date();
            const dataStr = agora.toLocaleDateString('pt-BR');
            const horaStr = agora.getHours().toString().padStart(2, '0') + ':' + agora.getMinutes().toString().padStart(2, '0');

            const card = document.createElement('div');
            card.className = 'chamado-card';
            card.innerHTML = `
                <div class="info-row">
                    <span style="font-weight:bold; color:var(--primary-neon);">${unidade}</span>
                    <span class="agenda-time"><i class="far fa-calendar-alt"></i> ${dataStr} | <i class="far fa-clock"></i> ${horaStr}</span>
                </div>
                <div style="margin: 5px 0; color: var(--text-muted); font-size: 0.85em;">Setor: ${setor}</div>
                <div style="color: white;">${descricao}</div>
                <div class="status-area"></div>
                <div class="acoes" style="margin-top:15px; display:flex; gap:10px">
                    <button onclick="finalizar(this)" style="background:var(--success-neon); border:none; border-radius:8px; padding:10px; font-weight:bold; flex:1; cursor:pointer">Finalizar</button>
                    <button onclick="this.parentElement.parentElement.remove()" style="background:var(--danger-neon); border:none; border-radius:8px; padding:10px; color:white; font-weight:bold; flex:1; cursor:pointer">Excluir</button>
                </div>
            `;
            document.getElementById('listaChamados').prepend(card);
            
            // Limpa campos
            document.getElementById('unidade').value = '';
            document.getElementById('descricao').value = '';
        }

        function finalizar(btn) {
            const agora = new Date();
            const horaFim = agora.getHours().toString().padStart(2, '0') + ':' + agora.getMinutes().toString().padStart(2, '0');
            const card = btn.parentElement.parentElement;
            
            // Adiciona a marca de finalização em vermelho
            const status = card.querySelector('.status-area');
            status.innerHTML = `<span class="finalizado-time"><i class="fas fa-check-circle"></i> Finalizado às: ${horaFim}</span>`;
            
            // Remove os botões de ação para o relatório não ficar poluído
            card.querySelector('.acoes').remove();
            
            // Move o card para a lista de relatórios
            document.getElementById('listaRelatorio').prepend(card);
            
            alert("Chamado movido para Relatórios!");
        }
    </script>
</body>
</html>
