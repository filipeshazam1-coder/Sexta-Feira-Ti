<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sexta-Feira TI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #050a15;
            --bg-card: #0f1a2d;
            --primary-neon: #00d2ff;
            --success-neon: #00ff88;
            --danger-neon: #ff3366;
            --text-main: #ffffff;
            --text-muted: #88a0bc;
            --border-color: #1e2f4d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; padding-bottom: 80px;
        }

        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header i { font-size: 50px; color: var(--primary-neon); }

        .card-input {
            background: var(--bg-card); padding: 20px; border-radius: 20px;
            border: 1px solid var(--border-color); margin-bottom: 20px;
        }

        label { display: block; margin: 15px 0 5px; color: var(--primary-neon); font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color); border-radius: 10px;
            color: white; box-sizing: border-box; margin-bottom: 10px;
        }

        .btn-acao {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer;
        }

        .chamado-card {
            background: var(--bg-card); margin-top: 15px; padding: 15px;
            border-radius: 15px; border-left: 5px solid var(--primary-neon);
        }

        .agenda-time { color: var(--success-neon); font-weight: bold; font-size: 0.85em; }
        .finalizado-full-time { color: var(--danger-neon); font-weight: bold; font-size: 0.85em; margin-top: 8px; display: block; }

        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0a1120; display: flex; justify-content: space-around;
            padding: 15px; border-top: 1px solid var(--border-color); z-index: 1000;
        }

        .nav-item { color: var(--text-muted); text-align: center; font-size: 0.7em; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--primary-neon); }
        
        .secao { display: none; }
        .secao.ativa { display: block; }

        .btn-card { border: none; padding: 8px; border-radius: 5px; font-weight: bold; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <i class="fas fa-robot"></i>
            <h1 style="margin: 10px 0 5px;">SEXTA-FEIRA</h1>
            <p style="color: var(--text-muted); font-size: 0.8em;">GESTÃO TI SAÚDE</p>
        </div>

        <div id="agenda" class="secao ativa">
            <div class="card-input">
                <label>UNIDADE / PSF:</label>
                <input type="text" id="unidade" placeholder="Ex: PSF 09">
                <label>SETOR:</label>
                <select id="setor">
                    <option>Administrativo</option><option>Consultório</option><option>Enfermagem</option><option>Farmácia</option><option>Recepção</option>
                </select>
                <label>DESCRIÇÃO:</label>
                <textarea id="descricao" rows="2"></textarea>
                <button class="btn-acao" onclick="criarChamado()">AGENDAR</button>
            </div>
            <div id="listaChamados"></div>
        </div>

        <div id="relatorio" class="secao">
            <input type="text" id="busca" placeholder="Pesquisar..." onkeyup="renderizar()" style="margin-bottom:10px">
            <div id="listaRelatorio"></div>
        </div>

        <div id="pedidos" class="secao">
            <div class="card-input">
                <label>LOCAL:</label>
                <input type="text" id="localPedido">
                <label>PEDIDO:</label>
                <textarea id="itemPedido" rows="2"></textarea>
                <button class="btn-acao" onclick="criarPedido()">ENVIAR PEDIDO</button>
            </div>
            <div id="listaPedidos"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="mudarAba('agenda', this)"><i class="fas fa-list"></i><br>AGENDA</div>
        <div class="nav-item" onclick="mudarAba('relatorio', this)"><i class="fas fa-file-medical"></i><br>RELATÓRIO</div>
        <div class="nav-item" onclick="mudarAba('pedidos', this)"><i class="fas fa-box"></i><br>PEDIDOS</div>
    </nav>

    <script>
        // BANCO DE DADOS LOCAL
        let chamados = JSON.parse(localStorage.getItem('chamados')) || [];
        let pedidos = JSON.parse(localStorage.getItem('pedidos')) || [];

        function mudarAba(id, el) {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('ativa');
            el.classList.add('active');
        }

        function salvar() {
            localStorage.setItem('chamados', JSON.stringify(chamados));
            localStorage.setItem('pedidos', JSON.stringify(pedidos));
            renderizar();
        }

        function criarChamado() {
            const u = document.getElementById('unidade').value;
            const s = document.getElementById('setor').value;
            const d = document.getElementById('descricao').value;
            if(!u || !d) return alert("Preencha!");

            const agora = new Date();
            chamados.push({
                id: Date.now(),
                unidade: u,
                setor: s,
                desc: d,
                inicio: agora.toLocaleDateString() + " | " + agora.getHours().toString().padStart(2,'0') + ":" + agora.getMinutes().toString().padStart(2,'0'),
                fim: null,
                status: 'aberto'
            });
            document.getElementById('unidade').value = ''; document.getElementById('descricao').value = '';
            salvar();
        }

        function finalizar(id) {
            const agora = new Date();
            const index = chamados.findIndex(c => c.id === id);
            chamados[index].fim = agora.toLocaleDateString() + " às " + agora.getHours().toString().padStart(2,'0') + ":" + agora.getMinutes().toString().padStart(2,'0');
            chamados[index].status = 'finalizado';
            salvar();
        }

        function excluir(id) {
            chamados = chamados.filter(c => c.id !== id);
            salvar();
        }

        function restaurar(id) {
            const index = chamados.findIndex(c => c.id === id);
            chamados[index].status = 'aberto';
            chamados[index].fim = null;
            salvar();
        }

        function criarPedido() {
            const l = document.getElementById('localPedido').value;
            const i = document.getElementById('itemPedido').value;
            if(!l || !i) return;
            pedidos.push({id: Date.now(), local: l, item: i});
            document.getElementById('localPedido').value = ''; document.getElementById('itemPedido').value = '';
            salvar();
        }

        function renderizar() {
            const busca = document.getElementById('busca').value.toLowerCase();
            const listaA = document.getElementById('listaChamados');
            const listaR = document.getElementById('listaRelatorio');
            const listaP = document.getElementById('listaPedidos');
            
            listaA.innerHTML = ''; listaR.innerHTML = ''; listaP.innerHTML = '';

            chamados.slice().reverse().forEach(c => {
                const html = `
                    <div class="chamado-card">
                        <div style="display:flex; justify-content:space-between">
                            <span style="color:var(--primary-neon); font-weight:bold">${c.unidade}</span>
                            <span class="agenda-time">${c.inicio}</span>
                        </div>
                        <div style="font-size:0.8em; color:var(--text-muted)">Setor: ${c.setor}</div>
                        <div style="margin:5px 0">${c.desc}</div>
                        ${c.fim ? `<span class="finalizado-full-time">Finalizado em: ${c.fim}</span>` : ''}
                        <div style="display:flex; gap:10px; margin-top:10px">
                            ${c.status === 'aberto' ? 
                                `<button onclick="finalizar(${c.id})" style="background:var(--success-neon)" class="btn-card">Finalizar</button>` : 
                                `<button onclick="restaurar(${c.id})" style="background:var(--primary-neon)" class="btn-card">Restaurar</button>`}
                            <button onclick="excluir(${c.id})" style="background:var(--danger-neon); color:white" class="btn-card">Excluir</button>
                        </div>
                    </div>`;
                
                if(c.status === 'aberto') listaA.innerHTML += html;
                else if(c.unidade.toLowerCase().includes(busca)) listaR.innerHTML += html;
            });

            pedidos.slice().reverse().forEach(p => {
                listaP.innerHTML += `
                    <div class="chamado-card" style="border-left-color:var(--success-neon)">
                        <div style="color:var(--success-neon); font-weight:bold">PEDIDO: ${p.local}</div>
                        <div>${p.item}</div>
                        <button onclick="pedidos = pedidos.filter(x => x.id !== ${p.id}); salvar()" style="margin-top:10px; width:100%; background:none; border:1px solid var(--danger-neon); color:var(--danger-neon); border-radius:5px">Remover</button>
                    </div>`;
            });
        }
        renderizar();
    </script>
</body>
</html>
